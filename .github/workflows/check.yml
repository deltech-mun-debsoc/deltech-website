name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate
    runs-on: ubuntu-latest
    env:
      # Build needs these set but never connects to a real DB — dummy is fine.
      DATABASE_URL: postgresql://user:password@localhost:5432/db
      DIRECT_URL: postgresql://user:password@localhost:5432/db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci # postinstall runs `prisma generate`

      - name: Checks
        run: npm run check

      - name: Build
        # Next's production build includes TypeScript validation.
        run: npm run build
