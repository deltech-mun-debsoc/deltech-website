name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate
    runs-on: ubuntu-latest
    env:
      # Build needs these set but never connects to a real DB — dummy is fine.
      DATABASE_URL: postgresql://user:password@localhost:5432/db
      DIRECT_URL: postgresql://user:password@localhost:5432/db
      # Lets check-env-isolation.ts query Vercel. Absent on fork and Dependabot
      # PRs, where that check skips itself rather than failing.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Without these the script falls back to .vercel/project.json, which is
      # gitignored and therefore never present on a PR runner: the project half
      # of the check silently did nothing. Same two secrets the deploy
      # workflows use.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci # postinstall runs `prisma generate`

      - name: Checks
        run: npm run check

      - name: Build
        # Next's production build includes TypeScript validation.
        run: npm run build
