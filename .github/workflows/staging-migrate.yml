name: Staging migrate

# Applies pending migrations to the STAGING database whenever staging moves.
#
# This is what makes "it goes to test first" a mechanism rather than a habit: a
# schema change reaches staging automatically, gets exercised there, and only
# then is promoted. Production stays MANUAL on purpose -- migrate-on-build was
# removed deliberately in d476bd2 (see docs/CI.md), and nothing here reverses
# that. This workflow can only ever reach the database behind STAGING_DIRECT_URL.
on:
  push:
    branches: [staging]
    # Only when the schema actually changed. A copy edit should not open a
    # database connection.
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - ".github/workflows/staging-migrate.yml"
  workflow_dispatch:

concurrency:
  # Never let two migration runs overlap on one database.
  group: staging-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to staging
    runs-on: ubuntu-latest
    env:
      # The Prisma CLI reads DIRECT_URL (see prisma.config.ts). This MUST be the
      # Supabase *session* pooler on port 5432: db.<ref>.supabase.co is IPv6-only
      # and unreachable from GitHub runners, and 6543 is the transaction pooler,
      # which cannot run DDL.
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
      DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Verify the target really is the staging database
        # `prisma migrate deploy` runs against whatever this secret contains. A
        # stale or mistyped value migrates some OTHER database, silently and
        # irreversibly -- and a secret is exactly the kind of value nobody
        # re-reads. Refuse unless the URL names the project we declared as
        # staging, the same allowlist the destructive seed uses.
        env:
          STAGING_DB_REF: ${{ secrets.STAGING_DB_REF }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "STAGING_DIRECT_URL is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          if [ -z "$STAGING_DB_REF" ]; then
            echo "STAGING_DB_REF is not set. It names the Supabase project this workflow"
            echo "is allowed to touch. Refusing to migrate an unidentified database."
            exit 1
          fi
          case "$DIRECT_URL" in
            *"$STAGING_DB_REF"*) echo "Target confirmed as the staging project." ;;
            *) echo "REFUSING: STAGING_DIRECT_URL does not contain STAGING_DB_REF."
               echo "The secret points at a different database than the one declared as staging."
               exit 1 ;;
          esac

      - name: Install
        run: npm ci # postinstall runs `prisma generate`

      - name: Show pending migrations
        run: npm run db:status || true

      - name: Apply
        run: npm run db:deploy
