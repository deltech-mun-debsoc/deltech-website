name: Cron (production)

# Production schedules are inert until the repo variable CRON_ENABLED is
# "true". A double run would be harmless -- payment-reminder claims its run and
# the others are idempotent -- but it would create noise. Schedules run from the
# default branch.

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "30 3 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [payment-reminder, gform-sync, media-sweep]

jobs:
  run:
    if: vars.CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
        run: |
          case "$SCHEDULE" in
            "0 3 * * *") JOB=payment-reminder ;;
            "30 3 * * *") JOB=gform-sync ;;
            "0 4 * * *") JOB=media-sweep ;;
          esac
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "https://www.deltechmun.in/api/cron/$JOB"
