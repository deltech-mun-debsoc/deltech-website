name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      # See deploy-test.yml: without these the CLI links to the token's default
      # scope rather than the project that owns the production domain.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Require this commit to be live on Test
        run: |
          TESTED_SHA=$(gh run list \
            --workflow "Deploy Test" \
            --branch main \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha')
          if [ "$TESTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Current main is not the latest successful Test deployment. Run 'Deploy Test' first."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@58.1.0 --no-audit --no-fund

      - name: Pull Production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Migrate Production database
        env:
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::PROD_DIRECT_URL is not configured."
            exit 1
          fi
          npx prisma migrate deploy

      - name: Deploy Production
        id: deploy
        run: |
          set -o pipefail
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")
          if [ -z "$URL" ]; then
            echo "::error::Vercel returned no deployment URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          for path in / /availability /signin; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "https://deltechmun.in${path}" > /dev/null
          done
          STATUS=$(curl --silent --location --output /dev/null --write-out "%{http_code}" \
            "https://deltechmun.in/api/cron/gform-sync")
          if [ "$STATUS" != "401" ]; then
            echo "::error::Protected Production cron returned HTTP $STATUS instead of 401."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Production is live"
            echo ""
            echo "- Site: <https://deltechmun.in>"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
