name: AWS deploy
run-name: AWS deploy · ${{ github.ref_name == 'main' && 'Production' || 'Staging' }} · ${{ inputs.sha || github.sha }}

# main -> www.deltechmun.in, staging -> test.deltechmun.in, on their own boxes.
# The image is built here (a 1 GB box must never build), shipped over SSH, and
# switched in by deploy/deploy.sh, which rolls back if it is unhealthy.
# DEPLOY_HOST and DEPLOY_KNOWN_HOSTS are GitHub *Environment* secrets, so each
# branch can only ever reach its own box.
#
# Inert until the repo variable AWS_DEPLOY is "true", so this can merge before
# the box exists. Rollback: run this workflow by hand with an older commit SHA,
# or on the box: /srv/mun/deploy.sh prod <sha>

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (blank = branch head)"
        required: false

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'Production' || 'Staging' }}
    if: vars.AWS_DEPLOY == 'true' && (github.ref_name == 'main' || github.ref_name == 'staging')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SVC: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Build image
        run: |
          sha=$(git rev-parse HEAD)
          echo "SHA=$sha" >> "$GITHUB_ENV"
          docker build \
            --build-arg APP_ENV="$APP_ENV" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg APP_VERSION="$sha" \
            -t "mun:$SVC-$sha" .

      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Each box is single-tenant, so a branch may update its own box's config.
      - name: Sync deploy files
        run: |
          scp deploy/compose.yml deploy/deploy.sh "deploy@${{ secrets.DEPLOY_HOST }}:/srv/mun/"
          scp "deploy/Caddyfile.$SVC" "deploy@${{ secrets.DEPLOY_HOST }}:/srv/mun/Caddyfile"
          ssh "deploy@${{ secrets.DEPLOY_HOST }}" 'cd /srv/mun && chmod +x deploy.sh && docker compose up -d caddy && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile'

      - name: Ship and switch
        run: |
          docker save "mun:$SVC-$SHA" | gzip | ssh "deploy@${{ secrets.DEPLOY_HOST }}" 'gunzip | docker load'
          ssh "deploy@${{ secrets.DEPLOY_HOST }}" "/srv/mun/deploy.sh $SVC $SHA"

      # Resolve the public hostname to this environment's box explicitly. This
      # proves Caddy, TLS, the new application version and its database without
      # accidentally testing a stale DNS target.
      - name: Verify AWS deployment health
        run: |
          host=$(echo "${{ vars.NEXT_PUBLIC_APP_URL }}" | sed 's|https\?://||')
          response_file=$(mktemp)
          code=$(curl --connect-timeout 10 --max-time 30 -sS \
            --resolve "$host:443:${{ secrets.DEPLOY_HOST }}" \
            -o "$response_file" -w '%{http_code}' \
            "https://$host/api/health" || true)

          cat "$response_file"
          [ "$code" = 200 ]
          version=$(printf '%.12s' "$SHA")
          jq -e --arg expected "$APP_ENV" --arg version "$version" \
            '.status == "ok" and .database == "ok" and .environment == $expected and .version == $version' \
            "$response_file" >/dev/null

          response_ms=$(jq -r '.responseMs' "$response_file")
          {
            echo "### AWS deployment healthy"
            echo "- Environment: $APP_ENV"
            echo "- Host: https://$host"
            echo "- Commit: \`$SHA\`"
            echo "- Container: healthy"
            echo "- Database: healthy (${response_ms} ms)"
            echo "- HTTPS through Caddy: healthy"
          } >> "$GITHUB_STEP_SUMMARY"
