name: Deploy Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/db
      DIRECT_URL: postgresql://user:password@localhost:5432/db
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Pin the scope and project. .vercel/ is gitignored, so without these
      # `vercel pull --yes` silently links to whatever scope the token defaults
      # to, and every later command (build, deploy, alias, and the env-isolation
      # scripts, which already read these two variables) follows it there. That
      # is how deployments landed in a personal scope while test.deltechmun.in
      # lives somewhere else, making `vercel alias set` fail on every run.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Checks
        run: npm run check

      - name: Install Vercel CLI
        run: npm install --global vercel@58.1.0 --no-audit --no-fund

      - name: Pull Test environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify database isolation
        run: npx tsx scripts/verify-database-isolation.ts
        env:
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Point Vercel Preview at the Test database
        run: npm run setup:staging
        env:
          DATABASE_ONLY: "1"
          SKIP_GH_SECRETS: "1"
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Pull configured Test environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify Vercel environment scopes
        run: npx tsx scripts/check-env-isolation.ts

      - name: Migrate Test database
        env:
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::STAGING_DIRECT_URL is not configured."
            exit 1
          fi
          npx prisma migrate deploy

      - name: Sync integration configuration
        run: npm run sync:staging:integrations
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Build Test
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

      - name: Deploy Test
        id: deploy
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: |
          set -o pipefail
          URL=$(vercel deploy \
            --prebuilt \
            --archive=tgz \
            --env DATABASE_URL="$STAGING_DATABASE_URL" \
            --env DIRECT_URL="$STAGING_DIRECT_URL" \
            --token="$VERCEL_TOKEN")
          if [ -z "$URL" ]; then
            echo "::error::Vercel returned no deployment URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Point test.deltechmun.in at this deployment
        run: vercel alias set "${{ steps.deploy.outputs.url }}" test.deltechmun.in --token="$VERCEL_TOKEN"

      - name: Smoke test
        run: |
          for path in / /availability /signin; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "https://test.deltechmun.in${path}" > /dev/null
          done
          STATUS=$(curl --silent --location --output /dev/null --write-out "%{http_code}" \
            "https://test.deltechmun.in/api/cron/gform-sync")
          if [ "$STATUS" != "401" ]; then
            echo "::error::Protected Test cron returned HTTP $STATUS instead of 401."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Test is ready"
            echo ""
            echo "- Site: <https://test.deltechmun.in>"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            echo ""
            echo "Inspect Test, then run **Deploy Production** when you are happy."
          } >> "$GITHUB_STEP_SUMMARY"
