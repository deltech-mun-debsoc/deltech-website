# Staging, on the production box. Lives at /srv/mun-staging, a separate compose
# project from production (/srv/mun), so `docker compose` in one directory can
# never stop, recreate or read the other's containers or volumes.
#
# One box instead of two halves the Lightsail bill until the conference. What
# that costs: staging and production now share 1 GB of RAM, a disk and a reboot.
# The limits below are what keep a staging runaway from taking production with
# it: staging gets less memory than production, and when memory runs out the
# kernel kills staging first (oom_score_adj).
#
# Production's Caddy reaches this app over the external network mun-edge. Only
# the `staging` service joins it, under a name production does not use, so
# Caddy's `app` can only ever mean production's app.
name: mun-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  staging:
    image: mun:staging-${APP_TAG:-none}
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    env_file: app.env
    environment:
      NODE_OPTIONS: --max-old-space-size=300
    volumes:
      - nextcache:/app/.next/cache
    mem_limit: 450m
    oom_score_adj: 500
    networks: [default, edge]

  # Its own Postgres, not a second database in production's: the destructive
  # staging seed, migrations and interns' experiments run against a different
  # server process and volume. Loopback only, on 5433 so it cannot collide with
  # production's 5432; CI reaches it through an SSH tunnel.
  db:
    image: postgres:17
    profiles: ["db"]
    restart: unless-stopped
    logging: *logging
    ports: ["127.0.0.1:5433:5432"]
    env_file:
      - path: db.env
        format: raw
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 64mb
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 250m
    oom_score_adj: 500

networks:
  edge:
    name: mun-edge
    external: true

volumes:
  pgdata:
  nextcache:
