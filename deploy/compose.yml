# Lives at /srv/mun on each Lightsail box, next to Caddyfile, deploy.sh and the
# env files (app.env, caddy.env: never in git). APP_ENV and APP_TAG are written
# into /srv/mun/.env by deploy.sh. See docs/AWS.md.
name: mun

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    # raw: Compose interpolates $ in env_file values by default, which silently
    # empties a bcrypt hash like $2a$14$...
    env_file:
      - path: caddy.env
        format: raw
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # One app service per box: production and staging have a box each, so a
  # staging runaway cannot starve production and each keeps its own Caddy.
  app:
    image: mun:${APP_ENV:-staging}-${APP_TAG:-none}
    pull_policy: never
    restart: unless-stopped
    env_file: app.env
    environment:
      NODE_OPTIONS: --max-old-space-size=600
    mem_limit: 700m

volumes:
  caddy_data:
  caddy_config:
